<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F8FB" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Каталог образовательных YouTube-плейлистов в порядке изучения: что нужно знать до каждого курса и что можно начинать прямо сейчас."
    />
    <title>Lectorea — каталог курсов в порядке изучения</title>

    <!--
      The mark, in the three forms browsers actually ask for: the .ico for the
      tab (still the only thing every browser reads), the SVG for the ones that
      prefer it and will scale it to any density, and the touch icon for a home
      screen on iOS, which ignores both of the others. The rest — the PWA sizes
      — are declared in the manifest, which vite-plugin-pwa injects here.
      public/favicon.svg is the source all of them are rendered from.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Shared links. Courses and playlists already have their own URLs, but this
      is a static single-page app, so a per-course card is filled in after the
      bundle rather than by a server — `scripts/prerender.ts` writes a file per
      URL with the title, description and card of that course. What stands here
      is what the dev server shows and what those pages are cut from: the
      catalogue, which is at least true of every URL in it.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lectorea" />
    <meta property="og:title" content="Lectorea — каталог курсов в порядке изучения" />
    <meta
      property="og:description"
      content="Образовательные YouTube-плейлисты, выстроенные в порядке изучения: что нужно знать до каждого курса и что он открывает дальше."
    />
    <!-- The map, drawn once into a picture by `pnpm og:build`: the app draws it
         at runtime and nothing that unfolds a link runs the app. Wide rather
         than square, because a square buys a thumbnail the size of a favicon in
         every feed that shows one, and a link to a catalogue of lectures is
         worth more room than that. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Карта знаний Lectorea: материки областей знаний в тёмном море"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        const stored = JSON.parse(localStorage.getItem('catalog.profile.v1') || '{}');
        const theme = stored?.settings?.theme || 'auto';
        const dark =
          theme === 'dark' ||
          (theme === 'auto' && !window.matchMedia('(prefers-color-scheme: light)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
