<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    The mark: two cells of the map already behind you, and the one they open.

    It is the catalogue in a glyph — the whole product is «what has to come
    first», so the icon is a piece of the graph rather than a letter. It reads
    upwards for the same reason the map does: the vertical axis is the
    direction of the dependency, prerequisites underneath what they unlock.

    Drawn in hexagons, and that is the part that changed. The mark used to be
    three circles joined by two lines, which is stroke for stroke the system
    «share» glyph — at the size a browser tab gives it, that is what it read
    as. Hexagons are the material the map itself is tiled from
    (`shared/tiles/hex.ts`, pointy-top, same grid), so the icon now says
    «Lectorea» rather than «send this to someone».

    Colours are the design system's own (`src/index.css`): the dark canvas,
    ink for what is done, accent green for what is now open.

    The gap between the cells is the seam between two territories on the map,
    and it is the one measurement here that is set by the smallest size rather
    than the largest. It is 4.2 of this 64 grid, which is a whole device pixel
    in a browser tab; the first cut of the mark used 1.6, and at 16 px that is
    four tenths of a pixel — antialiasing spent it, and three cells came out as
    one pale blob. Cell centres sit 25.6 apart and the cells themselves are
    24.7 across the flats: the difference is the seam, and it is the same on
    all three sides because they are neighbours on one hex grid.

    This file is the source of the mark. Every raster beside it — the .ico, the
    PWA sizes, the touch icon — is rendered from it by `pnpm icons:build`;
    edit here and re-render, never the other way round.
  -->
  <!--
    The plate the mark sits on. `data-tile` is how `scripts/icons.ts` finds it:
    a browser tab wants the rounded plate, a home screen and an Android mask
    want the mark bleeding to the edge, so the renderer drops these two rects
    and paints the ground itself. Nothing else in this file carries it.
  -->
  <rect data-tile="ground" width="64" height="64" rx="14" fill="#0B0F17" />
  <rect data-tile="edge" x="0.5" y="0.5" width="63" height="63" rx="13.5" fill="none" stroke="#243044" stroke-width="1" />

  <!--
    Each cell is a pointy-top hexagon whose corners are rounded by a stroke of
    its own colour: fill and stroke are the same paint, so the outline grows by
    half the stroke width and the joins come back round. Every attribute sits
    on the shape itself — the simpler rasterisers that turn this file into the
    .ico do not inherit them from a group.
  -->
  <path d="M19.2 32.74 L28.17 37.91 L28.17 48.27 L19.2 53.45 L10.23 48.27 L10.23 37.91 Z"
        fill="#E6EBF2" stroke="#E6EBF2" stroke-width="4" stroke-linejoin="round" />
  <path d="M44.8 32.74 L53.77 37.91 L53.77 48.27 L44.8 53.45 L35.83 48.27 L35.83 37.91 Z"
        fill="#E6EBF2" stroke="#E6EBF2" stroke-width="4" stroke-linejoin="round" />
  <path d="M32 10.57 L40.97 15.74 L40.97 26.10 L32 31.28 L23.03 26.10 L23.03 15.74 Z"
        fill="#34C98A" stroke="#34C98A" stroke-width="4" stroke-linejoin="round" />
</svg>
