name: Идея или замечание
description: Всё остальное — от опечатки до «а можно вот так»
labels: [idea]

# No title prefix and one field. Everything that is not a playlist, a course or
# a domain arrives here, and a form that asked anything else of it would be a
# form people route around by opening a blank issue instead.
body:
  - type: textarea
    id: note
    attributes:
      label: Что не так или что можно сделать
      description: >-
        Неверная зависимость, курс не в той колонке, мёртвая ссылка, неудобный
        экран, идея — всё сюда. Ссылка на страницу каталога помогает, но не
        обязательна.
    validations:
      required: true
