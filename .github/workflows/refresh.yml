name: refresh

# Runs the crawler until the queue drains or the daily quota does. Exhausting
# the quota is a normal end of the working day, not a failure — the queue lives
# in cache.db and the next run picks up exactly where this one stopped.
on:
  schedule:
    # Half past the reset, which is the only hour that matters: the quota is
    # Google's day, not ours, and it turns over at midnight Pacific — 08:00 UTC
    # in winter, 07:00 in summer. At the old 03:00 the job woke up four hours
    # *before* the reset and inherited whatever was left of a day the laptop had
    # already been spending, which is how a nightly run ends with `потрачено 0`.
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      discover:
        description: 'Also crawl channels for new playlists'
        type: boolean
        default: false

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore crawl cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache.db
          key: cache-db-${{ github.run_id }}
          restore-keys: cache-db-

      # The Actions cache is the working copy between nightly runs; the snapshot
      # in the `data-cache` release is what survives an eviction, a poisoned
      # cache entry, or a repository that has never crawled. Restoring costs no
      # quota, and does nothing at all when the cache came back with a crawl.
      - name: Seed from the published snapshot
        run: pnpm cache:restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # YOUTUBE_API_KEY2 and 3 are optional: keys from further Google Cloud
      # projects, spent in turn once the one before runs out. An unset secret
      # arrives as an empty string and is ignored, so the workflow needs no
      # branch for it — and slots run to 9 if a fourth project ever appears.
      - name: Discover new playlists
        if: inputs.discover
        run: pnpm data:discover
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY2: ${{ secrets.YOUTUBE_API_KEY2 }}
          YOUTUBE_API_KEY3: ${{ secrets.YOUTUBE_API_KEY3 }}

      - name: Refresh metadata, videos and liveness
        run: pnpm data:refresh
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY2: ${{ secrets.YOUTUBE_API_KEY2 }}
          YOUTUBE_API_KEY3: ${{ secrets.YOUTUBE_API_KEY3 }}

      # Single digits of quota — `channels.list` is one unit per call whatever
      # `part` asks for, and takes fifty ids at a time. Without it the rating's
      # reach signal has no denominator and the «Разошёлся» badge goes quiet.
      - name: Refresh channel subscriber counts
        run: pnpm data:subscribers
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEY2: ${{ secrets.YOUTUBE_API_KEY2 }}
          YOUTUBE_API_KEY3: ${{ secrets.YOUTUBE_API_KEY3 }}

      - name: Match playlists to courses
        run: pnpm data:match
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      # No key and no quota: this one asks oEmbed, not the Data API, because the
      # Data API's answer to it is wrong. After the match, since it only asks
      # about playlists a reader can reach and matching is what decides that.
      - name: Which playlists the player refuses as list=
        run: pnpm data:embeds

      # An interrupted crawl is still worth keeping — the queue lives in the
      # database and the next run resumes from it. A run that never got as far
      # as a playlist is not: `openDb` writes the whole schema before the first
      # request, so a job that dies on a missing key leaves a database that has
      # every table and nothing in them. Saved under a newer key it outranks the
      # last good cache on the `cache-db-` prefix, and the deploy publishes an
      # empty catalogue — five days of it from 2026-08-08. So the question is
      # whether there is material, not whether there are tables.
      - name: Is there a crawl worth keeping?
        id: crawl
        if: always()
        run: |
          if pnpm exec tsx -e "import { dbHasMaterial } from './scripts/lib/db.ts'; process.exit(dbHasMaterial() ? 0 : 1)"; then
            echo 'keep=true' >> "$GITHUB_OUTPUT"
          else
            echo 'keep=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Save crawl cache
        uses: actions/cache/save@v4
        if: always() && steps.crawl.outputs.keep == 'true'
        with:
          path: data/cache.db
          key: cache-db-${{ github.run_id }}

      # And the same crawl to the release, so the night's work outlives the
      # Actions cache — which evicts after a week idle, has a 10 GB ceiling the
      # repository shares, and cannot be written from anywhere but CI. Sixty-odd
      # megabytes without the raw bodies, which is cheap enough to do daily.
      - name: Publish the snapshot
        if: always() && steps.crawl.outputs.keep == 'true'
        run: pnpm cache:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # New high-confidence matches are a content change and go through review
      # like any other content change.
      - name: Open a pull request for new matches
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: data/overrides.yaml
          branch: data/auto-matches
          title: 'data: new playlist matches'
          commit-message: 'data: new playlist matches from the nightly crawl'
          body: |
            Automatic matches from the nightly crawl.

            Check a sample before merging: a wrong binding puts a playlist under
            the wrong course, and nobody looks at it again afterwards.
          labels: data
          delete-branch: true
