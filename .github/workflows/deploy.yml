name: deploy

# Data collection and deployment are deliberately separate: crawling must not
# block a deploy, and deploying must not spend YouTube quota.
on:
  push:
    branches: [main]
    # Listed as what to skip rather than what to catch: forgetting an entry
    # here costs one redundant deploy, while forgetting one in a `paths` list
    # would silently stop publishing real changes. Everything not named below
    # — data, sources, the scripts that build the catalogue, build config —
    # can change what the site shows.
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'sandbox/**'
      - 'README.md'
      - 'README.ru.md'
      - 'CONTRIBUTING.md'
      - '.env.example'
      - '.gitignore'
      - 'vitest.config.ts'
      # A wrapper over the pnpm scripts and nothing else — it cannot change what
      # the site shows, only how conveniently it is asked for.
      - 'Makefile'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/refresh.yml'

  # The nightly crawl updates cache.db without touching the repository, so
  # fresher metadata, video counts and liveness would otherwise sit in the
  # cache until somebody happened to push something.
  workflow_run:
    workflows: [refresh]
    types: [completed]

  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Build from the published cache snapshot, ignoring the Actions cache'
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    # A crawl that died has nothing new to publish, and republishing on its
    # schedule would only churn the site.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Read, and only read: the build downloads the crawl snapshot from a release
    # and publishes nothing back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The crawl cache is restored if a refresh run left one; without it the
      # build still succeeds and simply produces a catalogue with no playlists.
      #
      # Skipped when the run was dispatched with `snapshot`, which is how a
      # laptop publishes what it crawled (`make publish`). Restoring here would
      # quietly win: the Actions cache comes back holding last night's crawl,
      # `cache:restore` then finds material and does nothing, and the deploy
      # would rebuild the state that was already published — the one outcome
      # that makes "publish my local state" a lie.
      - name: Restore crawl cache
        if: ${{ !inputs.snapshot }}
        uses: actions/cache/restore@v4
        with:
          path: data/cache.db
          key: cache-db-
          restore-keys: cache-db-

      # And when it left none — a fresh fork, an eviction, a run that died before
      # it crawled — the published snapshot stands in. A no-op when the cache did
      # come back with a crawl in it, so the nightly cache stays in charge.
      #
      # `--force` drops that deference, and is only reachable by dispatching the
      # workflow by hand: it is what makes the snapshot the source of truth for
      # this one run, which is the whole of what `make publish` promises.
      - name: Seed from the published snapshot
        run: pnpm cache:restore ${{ inputs.snapshot && '--force' || '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm data:build

      # Taken from the run rather than written down, so a fork publishes links
      # to itself and the subdirectory always matches the repository name.
      # BASE_PATH is passed only for this repository, which has a domain and is
      # therefore served from its root; a fork gets an empty value and falls
      # back to the /<repo>/ subdirectory github.io gives it.
      - run: pnpm build
        env:
          VITE_REPO: ${{ github.repository }}
          BASE_PATH: ${{ github.repository == 'fivol/lectorea' && '/' || '' }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
