name: deploy

# Data collection and deployment are deliberately separate: crawling must not
# block a deploy, and deploying must not spend YouTube quota.
on:
  push:
    branches: [main]
    # Listed as what to skip rather than what to catch: forgetting an entry
    # here costs one redundant deploy, while forgetting one in a `paths` list
    # would silently stop publishing real changes. Everything not named below
    # — data, sources, the scripts that build the catalogue, build config —
    # can change what the site shows.
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'sandbox/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - '.env.example'
      - '.gitignore'
      - 'vitest.config.ts'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/refresh.yml'

  # The nightly crawl updates cache.db without touching the repository, so
  # fresher metadata, video counts and liveness would otherwise sit in the
  # cache until somebody happened to push something.
  workflow_run:
    workflows: [refresh]
    types: [completed]

  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    # A crawl that died has nothing new to publish, and republishing on its
    # schedule would only churn the site.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The crawl cache is restored if a refresh run left one; without it the
      # build still succeeds and simply produces a catalogue with no playlists.
      - name: Restore crawl cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache.db
          key: cache-db-
          restore-keys: cache-db-

      - run: pnpm data:build
      - run: pnpm build

      # Pages serves static files and knows nothing about client-side routes,
      # so a direct hit on /courses/:id would 404. Serving the app as the 404
      # page hands those URLs back to the router.
      - name: Serve the app for unknown paths too
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
