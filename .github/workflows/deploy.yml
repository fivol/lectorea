name: deploy

# Data collection and deployment are deliberately separate: crawling must not
# block a deploy, and deploying must not spend YouTube quota.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The crawl cache is restored if a refresh run left one; without it the
      # build still succeeds and simply produces a catalogue with no playlists.
      - name: Restore crawl cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache.db
          key: cache-db-
          restore-keys: cache-db-

      - run: pnpm data:build
      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
