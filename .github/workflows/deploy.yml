name: deploy

# Data collection and deployment are deliberately separate: crawling must not
# block a deploy, and deploying must not spend YouTube quota.
on:
  push:
    branches: [main]
    # Listed as what to skip rather than what to catch: forgetting an entry
    # here costs one redundant deploy, while forgetting one in a `paths` list
    # would silently stop publishing real changes. Everything not named below
    # — data, sources, the scripts that build the catalogue, build config —
    # can change what the site shows.
    paths-ignore:
      - 'docs/**'
      - 'tests/**'
      - 'sandbox/**'
      - 'README.md'
      - 'README.ru.md'
      - 'CONTRIBUTING.md'
      - '.env.example'
      - '.gitignore'
      - 'vitest.config.ts'
      # A wrapper over the pnpm scripts and nothing else — it cannot change what
      # the site shows, only how conveniently it is asked for.
      - 'Makefile'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/workflows/ci.yml'
      - '.github/workflows/refresh.yml'

  # The nightly crawl updates cache.db without touching the repository, so
  # fresher metadata, video counts and liveness would otherwise sit in the
  # cache until somebody happened to push something.
  workflow_run:
    workflows: [refresh]
    types: [completed]

  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    # A crawl that died has nothing new to publish, and republishing on its
    # schedule would only churn the site.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Read, and only read: the build downloads the crawl snapshot from a release
    # and publishes nothing back.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The crawl cache is restored if a refresh run left one; without it the
      # build still succeeds and simply produces a catalogue with no playlists.
      - name: Restore crawl cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache.db
          key: cache-db-
          restore-keys: cache-db-

      # And the release on top of it whenever the release is the newer
      # generation — a fresh fork or an eviction, where the cache came back with
      # nothing, and equally a snapshot sent up from a laptop since the last
      # nightly run, which is what makes `make publish` publish anything at all.
      # Nothing to do in the ordinary case, at the cost of one small download.
      - name: Seed from the published snapshot
        run: pnpm cache:restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm data:build

      # Taken from the run rather than written down, so a fork publishes links
      # to itself and the subdirectory always matches the repository name.
      # BASE_PATH is passed only for this repository, which has a domain and is
      # therefore served from its root; a fork gets an empty value and falls
      # back to the /<repo>/ subdirectory github.io gives it.
      # The analytics stream is this site's and this site's only: a fork gets an
      # empty value and sends nothing at all, which is the right default for
      # somebody else's copy of the catalogue. Written here rather than kept as
      # a secret because a measurement id is public by construction — it ships
      # inside the bundle, and hiding it would only hide it from us.
      - run: pnpm build
        env:
          VITE_REPO: ${{ github.repository }}
          BASE_PATH: ${{ github.repository == 'fivol/lectorea' && '/' || '' }}
          VITE_GA4_ID: ${{ github.repository == 'fivol/lectorea' && 'G-5N7EE7KHVS' || '' }}
          # The optional sync account — docs/sync.md. Kept as repository secrets
          # rather than written here, not because a Firebase web config is
          # secret (it ships inside the bundle either way) but because a fork
          # must not build against this project's Firestore: an unset secret is
          # an empty string, and an empty string is a site with no accounts.
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
