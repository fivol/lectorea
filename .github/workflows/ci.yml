name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Tests — levels, cycles, column order, score, search
        run: pnpm test

      # Validates the schemas, proves the deps graph is acyclic, checks that
      # every dependency points at a course that exists and that each course
      # sits in the file its first domain names. This is the step that catches
      # markup mistakes the eye cannot see.
      - name: Data
        run: pnpm data:build

      - name: Localisation keys and course text
        run: pnpm check:i18n

      - name: Frontend build
        run: pnpm build
