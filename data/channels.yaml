# Channels to crawl. `01-discover.ts` walks each one and collects its playlists.
#
# `id` may be either a canonical channel id (`UC…`) or a handle (`@name`).
# Handles are resolved once via channels.list?forHandle and cached in cache.db,
# so the file stays readable and does not need id archaeology to edit.
#
# One crawl of a channel costs 1 unit for the channel plus 1 unit per 50 playlists.
# Adding a channel here is cheap; removing one does not delete already-collected
# playlists, it only stops refreshing them.
#
# The bar for being listed here is *structured courses on subjects the catalogue
# has*: playlists that are one course each, in teaching order. Not necessarily a
# university, and not necessarily lectures — a teacher's 25-part course on music
# theory counts, and the fields this catalogue is emptiest in are exactly the
# ones universities publish least. A channel of excellent standalone videos —
# Veritasium, Mathologer — has nothing to point a course at, and every playlist
# it does have ("Physics", "Popular videos") is a topic bin that matching would
# have to throw away. Verified with the API before adding: a channel earns its
# line by having several playlists of ~10+ videos that name a subject.
#
# The bar in full is docs/harvest.md; where these came from, and which
# plausible-looking channels were refused and why, is docs/channel-hunt.md.

