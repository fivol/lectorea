# ───────────────────  Hunt of 2026-08-14: the thin courses  ────────────────────
#
# The 2026-08-13 hunt closed the empty courses; this one went after the ones
# left at one or two playlists, where a single channel disappearing takes the
# subject with it. Five parallel searches, one per group of fields, and every
# survivor below was put through scripts/_vet.ts — the numbers in the comments
# are what the API answered, not what a listicle claimed.
#
# The refusals are the more useful half and are in docs/channel-hunt.md. The
# short version: three channels were refused for size rather than quality —
# Virtual University of Pakistan (466 playlists of 10+, but each "course" is a
# 300-clip topic dump), Vidya-mitra (1072, behind 3100-video discipline bins)
# and МИАН (236, mostly общеинститутский семинар and летние школы). All three
# own material the catalogue wants, so the two playlists actually worth having
# were bound by hand instead of paying thousands of units for the channel.

# ── Historiography, economic history, demography, project management ──

- id: '@UMassEconomics'
  title: UMass Economics
  providerId: umass
  lang: en

# Five semesters of the same Introduction to Demography — the shape that made
# Onur Mutlu worth having, on a course that had one playlist.
