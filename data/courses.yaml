# The course graph.
#
# ONE UNIT = ONE SEMESTER COURSE. Splitting a course into topics shifts every
# level to the right and ruins the layout for everyone else. See CONTRIBUTING.md.
#
# domains : the first one is primary — it gives the card its colour
# deps    : hard prerequisites. Direct only, never transitive
# soft    : helpful but not required. Drawn dashed, excluded from the path
# related : mutual links. Not directed, excluded from the topological sort
#
# Titles and descriptions live in data/i18n/{lang}.json under `course.{id}.title`.

