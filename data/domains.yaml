# Domains of knowledge — the territories of the map.
#
# continent : formal | social | humanities
# bridge    : true for interdisciplinary domains living in the straits
# dependsOn : source domains, used for the cascade highlight on hover
# color     : base of the domain palette; a variation of its continent hue
# shapeId   : id of the <path> in public/map.svg
#
# Titles and descriptions live in data/i18n/{lang}.json under `domain.{id}.title`.

# ───────────────────────────  Formal & natural  ───────────────────────────

- id: math
  continent: formal
  color: '#4CC9F0'
  shapeId: shape-math
  bandOrder: 10
  dependsOn: []

- id: logic
  continent: formal
  parent: math
  color: '#6FD4F5'
  shapeId: shape-logic
  bandOrder: 20
  dependsOn: [math]

