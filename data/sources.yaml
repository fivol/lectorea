# Lists and catalogues mined by `09-import.ts` for YouTube playlist links.
#
# Two shapes of entry: a GitHub repository (`repo` + `path`, read raw) or a
# plain `url` for anything else on the web. Both are free — quota is only spent
# resolving the ids that come out, fifty to a unit.
#
# The importer never creates courses. Anything it cannot map to an existing
# course lands in data/proposed-courses.yaml for a human to add with real
# `deps` — auto-generated dependencies are a guaranteed way to ruin the graph.
#
# These lists link *playlists* rather than channels — a course at a time —
# which is why they are worth reading even where the channel behind them is
# already crawled: a curated link is a course somebody vouched for.
# docs/harvest.md is the full list of seams; docs/channel-hunt.md records what
# each of these yielded the first time round.

- id: awesome-courses
  repo: prakhar1989/awesome-courses
  path: README.md

- id: free-programming-books
  repo: EbookFoundation/free-programming-books
  path: courses/free-courses-en.md

- id: free-programming-books-ru
  repo: EbookFoundation/free-programming-books
  path: courses/free-courses-ru.md

