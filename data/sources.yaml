# ── Course catalogues on the open web ────────────────────────────────────────
# Not GitHub, and not lists of links somebody collected: institutions and
# editors publishing curricula, one playlist per course. Probed before being
# listed — a page whose listing is built by JavaScript (Open Yale, NPTEL,
# Class Central) has no links in its HTML and is not worth a request.

- id: openculture-courses
  url: https://www.openculture.com/freeonlinecourses

- id: openculture-cs
  url: https://www.openculture.com/computer_science_free_courses

- id: openculture-languages
  url: https://www.openculture.com/freelanguagelessons

# The lecturer's own index of complete philosophy courses, with direct playlist
# links and reading lists. Unlike a general channel page, it already states the
# unit the catalogue needs: one playlist per course.
- id: jeffrey-kaplan-courses
  url: https://www.jeffreykaplan.org/youtube
