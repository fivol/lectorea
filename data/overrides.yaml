  # «Алгоритмы и структуры данных» — один семестр, который читает два
  # наших курса. 130 записей носят это имя, и в 41 из них названия лекций
  # подтверждают оба предмета: сортировки и динамика рядом с хеш-таблицами
  # и деревьями. Ещё 54 молчат — их лекции называются «Лекция 7», и
  # единственное свидетельство о них это заголовок, который называет оба.
  # Такие тоже идут в оба: показать запись про алгоритмы и структуры данных
  # в обоих курсах — в худшем случае повтор, а спрятать её от одного из них
  # — потеря. Остальные 35 названы обоими предметами, а читают один: у ФПМИ
  # это осенний и весенний семестры одного «АиСД», и они разложены порознь.
