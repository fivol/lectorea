# Courses whose primary domain is `engineering`.
#
# ONE UNIT = ONE SEMESTER COURSE. Splitting a course into topics shifts every
# level to the right and ruins the layout for everyone else. See CONTRIBUTING.md.
#
# The file is chosen by the FIRST entry of `domains` — that is the only rule for
# where a course lives, and CI enforces it. Placement is storage, nothing else:
# it has no effect on the graph.
#
# domains  : the first one is primary — it gives the card its colour and this file
# deps     : hard prerequisites. Direct only, never transitive
# soft     : helpful but not required, excluded from the path
# related  : mutual links, excluded from the topological sort
# minLevel : manual floor under the computed level. Rare, always with a comment
#
# Titles and descriptions live in data/i18n/{lang}.json under `course.{id}.*`.

- id: strength-of-materials
  domains: [engineering]
  stage: bachelor-3
  deps: [mechanics]

- id: electrical-circuits
  domains: [engineering]
  stage: bachelor-4
  deps: [electrodynamics]

- id: control-theory
  domains: [engineering]
  stage: bachelor-3
  deps: [differential-equations]

- id: signal-processing
  domains: [engineering]
  stage: bachelor-3
  deps: [calculus-3, linear-algebra]
  soft: [probability]

- id: robotics
  domains: [engineering]
  stage: bachelor-4
  deps: [control-theory]
  soft: [programming-intro]

- id: digital-logic
  domains: [engineering]
  stage: bachelor-1
  deps: [school-algebra]
  # Gates are Boolean algebra with a soldering iron. Not a gate on the course —
  # it is taught from scratch — but the reader who has it sees why it works.
  soft: [discrete-math]

- id: analog-electronics
  domains: [engineering]
  stage: bachelor-2
  deps: [electrical-circuits]

- id: metrology
  domains: [engineering]
  stage: bachelor-2
  deps: [electrical-circuits, probability]

- id: transport-phenomena
  domains: [engineering]
  stage: bachelor-3
  deps: [differential-equations, thermodynamics]

- id: ocean-engineering
  domains: [engineering]
  stage: bachelor-4
  # Wave loads are a fluids problem, and the course stood on structures alone.
  # MIT reaches it through hydrodynamics: 2.016 reads «Prereq: 2.005», the
  # thermal-fluids course that transport phenomena stands in for here.
  deps: [strength-of-materials, transport-phenomena]
  related: [oceanography]
  refs:
    syllabus: https://catalog.mit.edu/subjects/2/

- id: fluid-mechanics
