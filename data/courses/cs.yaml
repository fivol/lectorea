# Courses whose primary domain is `cs`.
#
# ONE UNIT = ONE SEMESTER COURSE. Splitting a course into topics shifts every
# level to the right and ruins the layout for everyone else. See CONTRIBUTING.md.
#
# The file is chosen by the FIRST entry of `domains` — that is the only rule for
# where a course lives, and CI enforces it. Placement is storage, nothing else:
# it has no effect on the graph.
#
# domains  : the first one is primary — it gives the card its colour and this file
# deps     : hard prerequisites. Direct only, never transitive
# soft     : helpful but not required, excluded from the path
# related  : mutual links, excluded from the topological sort
# minLevel : manual floor under the computed level. Rare, always with a comment
#
# Titles and descriptions live in data/i18n/{lang}.json under `course.{id}.*`.

- id: programming-intro
  domains: [cs]
  stage: school-11

- id: data-structures
  domains: [cs]
  stage: bachelor-2
  deps: [programming-intro, discrete-math]

- id: algorithms
  domains: [cs]
  stage: bachelor-2
  deps: [data-structures]
  refs:
    syllabus: https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-spring-2020/

- id: computer-architecture
  domains: [cs]
  stage: bachelor-1
  # Digital logic was assumed rather than written: this course opens on gates and
  # flip-flops and never teaches them. The edge exists in every curriculum that
  # gives them separate semesters, so it belongs here.
  deps: [programming-intro, digital-logic]

- id: operating-systems
  domains: [cs]
  stage: bachelor-3
  deps: [computer-architecture, algorithms]

- id: networks
  domains: [cs]
  stage: bachelor-3
  deps: [operating-systems]

- id: databases
  domains: [cs]
  stage: bachelor-3
  deps: [algorithms]
  # MIT 6.5830 makes a systems course a hard prerequisite; Stanford CS145 does
  # not. Buffer pools, paging and durability read better with it, so it goes in
  # as a hint rather than as a gate that would move the course two columns.
  soft: [operating-systems]

- id: theory-of-computation
  domains: [cs, logic]
  stage: bachelor-2
  deps: [mathematical-logic]

- id: compilers
  domains: [cs]
  stage: bachelor-3
  # MIT 6.1100 reads «Prereq: 6.1020 and 6.1910» — the second is computation
  # structures. Code generation and register allocation are aimed at a machine,
  # and a course that has never seen a pipeline has nothing to aim at.
  deps: [algorithms, theory-of-computation, computer-architecture]
  refs:
    syllabus: https://catalog.mit.edu/subjects/6/

- id: distributed-systems
  domains: [cs]
  stage: bachelor-4
  deps: [networks]

- id: cryptography
  domains: [cs]
  stage: bachelor-3
  deps: [number-theory, algorithms]
  soft: [probability]

- id: computer-graphics
  domains: [cs]
  stage: bachelor-3
  deps: [linear-algebra, algorithms]

- id: functional-programming
  domains: [cs]
  stage: bachelor-1
  deps: [programming-intro]
  soft: [category-theory]

- id: software-engineering
  domains: [cs]
  stage: bachelor-1
  deps: [programming-intro]
  soft: [databases]

- id: computer-security
  domains: [cs]
  stage: bachelor-4
  deps: [networks, cryptography]
