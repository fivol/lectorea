# Courses whose primary domain is `physics`.
#
# ONE UNIT = ONE SEMESTER COURSE. Splitting a course into topics shifts every
# level to the right and ruins the layout for everyone else. See CONTRIBUTING.md.
#
# The file is chosen by the FIRST entry of `domains` — that is the only rule for
# where a course lives, and CI enforces it. Placement is storage, nothing else:
# it has no effect on the graph.
#
# domains  : the first one is primary — it gives the card its colour and this file
# deps     : hard prerequisites. Direct only, never transitive
# soft     : helpful but not required, excluded from the path
# related  : mutual links, excluded from the topological sort
# minLevel : manual floor under the computed level. Rare, always with a comment
#
# Titles and descriptions live in data/i18n/{lang}.json under `course.{id}.*`.

- id: mechanics
  domains: [physics]
  stage: bachelor-2
  deps: [calculus-2]

- id: analytical-mechanics
  domains: [physics]
  stage: bachelor-3
  deps: [mechanics, differential-equations]

- id: oscillations-waves
  domains: [physics]
  stage: bachelor-3
  deps: [mechanics, differential-equations]

- id: electrodynamics
  domains: [physics]
  stage: bachelor-3
  # It asked for the mathematics and not for a single hour of physics: a
  # third-year Maxwell course was reachable without ever having met a wave.
  # MIT 8.07 reads «Prereq: 8.03 and 18.03» — 8.03 is oscillations and waves,
  # which carries mechanics and the differential equations along with it.
  deps: [oscillations-waves]
  refs:
    syllabus: https://catalog.mit.edu/subjects/8/

- id: thermodynamics
  domains: [physics]
  stage: bachelor-3
  deps: [mechanics]

- id: optics
  domains: [physics]
  stage: bachelor-4
  # Waves now arrive through electrodynamics, so naming them again is the
  # transitive edge CI warns about.
  deps: [electrodynamics]

- id: special-relativity
  domains: [physics]
  stage: bachelor-4
  # Mechanics comes in under electrodynamics now — same transitive edge.
  deps: [electrodynamics]

- id: general-relativity
  domains: [physics]
  stage: master-2
  deps: [special-relativity, differential-geometry]

- id: quantum-mechanics
  domains: [physics]
  stage: bachelor-4
  # Linear algebra is the language of the course, but it arrives under
  # analytical mechanics and naming it again is the transitive edge. It is on
  # the path either way, which is where the reader looks for it.
  deps: [oscillations-waves, analytical-mechanics]

- id: statistical-physics
  domains: [physics]
  stage: master-1
  deps: [thermodynamics, probability, quantum-mechanics]

- id: condensed-matter
  domains: [physics]
  stage: phd
  deps: [statistical-physics]

- id: quantum-field-theory
  domains: [physics]
  stage: phd
  deps: [quantum-mechanics, special-relativity]

- id: nuclear-physics
  domains: [physics]
  stage: master-2
  deps: [quantum-mechanics]

- id: mathematical-physics
  domains: [physics, math]
  stage: bachelor-3
  deps: [pde]
  soft: [complex-analysis]
