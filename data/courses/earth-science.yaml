# Courses whose primary domain is `earth-science`.
#
# ONE UNIT = ONE SEMESTER COURSE. Splitting a course into topics shifts every
# level to the right and ruins the layout for everyone else. See CONTRIBUTING.md.
#
# The file is chosen by the FIRST entry of `domains` — that is the only rule for
# where a course lives, and CI enforces it. Placement is storage, nothing else:
# it has no effect on the graph.
#
# domains  : the first one is primary — it gives the card its colour and this file
# deps     : hard prerequisites. Direct only, never transitive
# soft     : helpful but not required, excluded from the path
# related  : mutual links, excluded from the topological sort
# minLevel : manual floor under the computed level. Rare, always with a comment
#
# Titles and descriptions live in data/i18n/{lang}.json under `course.{id}.*`.

- id: geology
  domains: [earth-science]
  stage: bachelor-1
  deps: [general-chemistry]

- id: meteorology
  domains: [earth-science]
  stage: bachelor-3
  deps: [thermodynamics, differential-equations]

- id: oceanography
  domains: [earth-science]
  stage: bachelor-4
  deps: [geology, meteorology]

- id: geophysics
  domains: [earth-science]
  stage: bachelor-3
  # MIT 12.201 reads «Prereq: Physics II (GIR) and 18.03». Seismic waves and
  # the potential fields of gravimetry are differential equations before they
  # are anything else.
  deps: [geology, mechanics, differential-equations]
  refs:
    syllabus: https://catalog.mit.edu/subjects/12/

- id: geodesy
  domains: [earth-science]
  stage: bachelor-2
  deps: [statistics]

- id: climatology
  domains: [earth-science]
  stage: bachelor-3
  deps: [meteorology]

- id: historical-geology
  domains: [earth-science]
  stage: bachelor-2
  deps: [geology, general-biology]

- id: geochemistry
  domains: [earth-science]
  stage: bachelor-3
  deps: [geology]
