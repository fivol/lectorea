# Courses whose primary domain is `math`.
#
# ONE UNIT = ONE SEMESTER COURSE. Splitting a course into topics shifts every
# level to the right and ruins the layout for everyone else. See CONTRIBUTING.md.
#
# The file is chosen by the FIRST entry of `domains` — that is the only rule for
# where a course lives, and CI enforces it. Placement is storage, nothing else:
# it has no effect on the graph.
#
# domains  : the first one is primary — it gives the card its colour and this file
# deps     : hard prerequisites. Direct only, never transitive
# soft     : helpful but not required, excluded from the path
# related  : mutual links, excluded from the topological sort
# minLevel : manual floor under the computed level. Rare, always with a comment
#
# Titles and descriptions live in data/i18n/{lang}.json under `course.{id}.*`.

- id: school-algebra
  domains: [math]
  stage: school-9

- id: calculus-1
  domains: [math]
  stage: bachelor-1
  deps: [school-algebra]
  refs:
    syllabus: https://ocw.mit.edu/courses/18-01-single-variable-calculus-fall-2006/

- id: calculus-2
  domains: [math]
  stage: bachelor-2
  deps: [calculus-1]

- id: calculus-3
  domains: [math]
  stage: bachelor-2
  deps: [calculus-2]
  refs:
    syllabus: https://ocw.mit.edu/courses/18-02-multivariable-calculus-fall-2007/

- id: linear-algebra
  domains: [math]
  stage: bachelor-1
  deps: [school-algebra]
  refs:
    syllabus: https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/

- id: discrete-math
  domains: [math]
  stage: bachelor-1
  deps: [school-algebra]

- id: combinatorics
  domains: [math]
  stage: bachelor-2
  deps: [discrete-math]

- id: number-theory
  domains: [math]
  stage: bachelor-2
  deps: [discrete-math]

- id: abstract-algebra
  domains: [math]
  stage: bachelor-2
  deps: [linear-algebra, discrete-math]

- id: real-analysis
  domains: [math]
  stage: bachelor-2
  deps: [calculus-2]

- id: complex-analysis
  domains: [math]
  stage: bachelor-3
  deps: [real-analysis, calculus-3]

- id: topology
  domains: [math]
  stage: bachelor-3
  deps: [real-analysis]

- id: measure-theory
  domains: [math]
  stage: bachelor-3
  deps: [real-analysis]

- id: functional-analysis
  domains: [math]
  stage: bachelor-3
  deps: [measure-theory, topology]

- id: differential-equations
  domains: [math]
  stage: bachelor-3
  deps: [calculus-3, linear-algebra]

- id: pde
  domains: [math]
  stage: bachelor-3
  deps: [differential-equations]

- id: differential-geometry
  domains: [math]
  stage: bachelor-3
  deps: [calculus-3, linear-algebra, topology]

- id: graph-theory
  domains: [math, cs]
  stage: bachelor-2
  deps: [discrete-math]

- id: optimization
  domains: [math]
  stage: bachelor-3
  deps: [calculus-3, linear-algebra]

- id: numerical-methods
  domains: [math, cs]
  stage: bachelor-2
  deps: [calculus-2, linear-algebra]
  # MIT 18.330 makes differential equations a hard prerequisite because half of
  # it is numerical ODEs. Here the course sits a year earlier and runs beside
  # them, so it is a hint rather than a gate that would cost two columns.
  soft: [programming-intro, differential-equations]

- id: category-theory
  domains: [math]
  stage: bachelor-3
  deps: [abstract-algebra, topology]
