# Courses whose primary domain is `biology`.
#
# ONE UNIT = ONE SEMESTER COURSE. Splitting a course into topics shifts every
# level to the right and ruins the layout for everyone else. See CONTRIBUTING.md.
#
# The file is chosen by the FIRST entry of `domains` — that is the only rule for
# where a course lives, and CI enforces it. Placement is storage, nothing else:
# it has no effect on the graph.
#
# domains  : the first one is primary — it gives the card its colour and this file
# deps     : hard prerequisites. Direct only, never transitive
# soft     : helpful but not required, excluded from the path
# related  : mutual links, excluded from the topological sort
# minLevel : manual floor under the computed level. Rare, always with a comment
#
# Titles and descriptions live in data/i18n/{lang}.json under `course.{id}.*`.

- id: general-biology
  domains: [biology]
  stage: school-10

- id: cell-biology
  domains: [biology]
  stage: bachelor-1
  # Membranes, gradients and signalling are chemistry before they are biology,
  # and the whole branch downstream inherited the gap. MIT reaches the same edge
  # the long way round — 7.06 needs 7.05, which needs 5.12, which needs the
  # Chemistry GIR — but here cell biology runs *before* biochemistry, so the
  # chemistry has to be named directly or it is nowhere in the ancestry at all.
  deps: [general-biology, general-chemistry]
  # Functional groups make the macromolecules legible; MIT gates the whole
  # cell block behind organic, but here it would push the branch a column
  # right for a course that teaches what it needs as it goes.
  soft: [organic-chemistry]
  refs:
    syllabus: https://catalog.mit.edu/subjects/7/

- id: genetics
  domains: [biology]
  stage: bachelor-2
  deps: [cell-biology]
  soft: [probability]

- id: molecular-biology
  domains: [biology]
  stage: bachelor-2
  # MIT 7.28 reads «Prereq: 7.03» — replication and regulation are taught
  # through genetics, not merely alongside it. `cell-biology` drops out of the
  # line: biochemistry already carries it, and CI calls that out.
  deps: [biochemistry, genetics]
  refs:
    syllabus: https://catalog.mit.edu/subjects/7/

- id: evolution
  domains: [biology]
  stage: bachelor-2
  deps: [genetics]
  soft: [statistics]

- id: ecology
  domains: [biology]
  stage: bachelor-1
  deps: [general-biology]
  soft: [statistics]

- id: physiology
  domains: [biology]
  stage: bachelor-2
  deps: [cell-biology]

- id: microbiology
  domains: [biology]
  stage: bachelor-2
  deps: [cell-biology]

- id: neuroscience
  domains: [biology]
  stage: bachelor-2
  deps: [physiology]
  # The synapse is receptors and second messengers before it is anything else.
  soft: [biochemistry]
